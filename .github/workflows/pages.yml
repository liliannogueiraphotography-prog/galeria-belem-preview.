name: Publicar Galeria Belem
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validar navegação e recursos da galeria
        run: node .github/scripts/gallery-smoke.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Separar somente os arquivos públicos aprovados
        run: |
          mkdir -p _site
          cp index.html A_Bencao_Belem_Site.mp3 Trilha_Estrela_de_Belem_site.mp3 _site/
      - name: Preparar arquivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
